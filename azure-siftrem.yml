# shutdown at end if not used directly?
- name: Azure VM halt
  hosts: localhost
  gather_facts: no
  vars:
    base_rg: investigate
    base_name: "{{ base_rg }}"
    vm_name: "{{ base_name }}vm"
  tasks:
    - name: Stop VM
      azure.azcollection.azure_rm_virtualmachine:
        resource_group: "{{ base_rg }}"
        name: "{{ vm_name }}"
        started: no
      when: false
